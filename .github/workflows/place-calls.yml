name: Place scheduled calls

on:
  schedule:
    # Runs every 5 minutes — GitHub Actions minimum granularity.
    # If a user's standup_time or eod_time falls on a non-multiple-of-5 minute,
    # they'll be dialed at the next 5-minute slot.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Hit cron endpoint
        run: |
          token_response=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=powerwyze-scheduled-calls")
          oidc_token=$(echo "$token_response" | jq -r '.value')
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "https://powerwyze-app.vercel.app/api/cron/place-calls" \
            -H "Authorization: Bearer $oidc_token")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
